[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curizx-mcp-server"
version = "0.1.0"
description = "AI-Powered Development Intelligence MCP Server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Rayhan", email = "" }
]
keywords = ["mcp", "model-context-protocol", "ai", "github", "code-analysis", "security", "curizx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastmcp>=0.4.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "PyGithub>=2.3.0",
    "duckduckgo-search>=6.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
curizx-mcp-server = "server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
