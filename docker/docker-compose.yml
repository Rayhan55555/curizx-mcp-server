version: "3.8"

services:
  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: curizx-mcp-server
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import server; print('healthy')"]
      interval: 30s
      timeout: 5s
      retries: 3
